server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name reports.example.com;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fusion-acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}
