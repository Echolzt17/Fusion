limit_req_zone $binary_remote_addr zone=fusion_source:10m rate=6r/m;
limit_req_zone $server_name zone=fusion_global:1m rate=60r/m;
limit_conn_zone $server_name zone=fusion_connections:1m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reports.example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/reports.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    limit_req_status 429;
    location = /v1/error-reports {
        limit_except POST { deny all; }
        limit_req zone=fusion_source burst=6 nodelay;
        limit_req zone=fusion_global burst=10 nodelay;
        limit_conn fusion_connections 8;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 60s;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:18880;
    }
    location ^~ /v1/admin/ {
        limit_except GET { deny all; }
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:18880;
    }
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18880;
    }
    location / { return 404; }
}
