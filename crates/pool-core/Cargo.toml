[package]
name = "pool-core"
version = "1.0.12"
edition = "2021"

[dependencies]
fusion-report-protocol = { path = "../report-protocol" }
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
http-body = "1"
# Inspect typed transport errors from the already-locked HTTP/TLS stack.
hyper = { version = "1", default-features = false }
# default-features=false also disables Windows system proxy discovery.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "=0.10.0"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml_edit = { version = "0.22", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Credentials", "Win32_Security_Cryptography"] }
