[package]
name = "personal-codex-pool"
version = "1.0.14-rc.1"
description = "Personal local Codex account pool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fusion-report-protocol = { path = "../crates/report-protocol" }
uuid = { version = "1", features = ["v4"] }
pool-core = { path = "../crates/pool-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "system-proxy"] }
semver = "1"
minisign-verify = "0.3"
base64 = "0.23"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dom_query = { version = "=0.28.0", default-features = false }
serde_yaml_ng = "=0.10.0"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }

[features]
# Never enabled by the production signing/build script.
update-acceptance = []
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
